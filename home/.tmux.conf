# Fish jako default shell
set-option -g default-shell /opt/homebrew/bin/fish

# Prefix: Ctrl+A
set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Splits zachovají current directory
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim navigace mezi panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim navigace mezi windows
bind -n 'M-h' previous-window   # Alt+H
bind -n 'M-l' next-window       # Alt+L

# Indexování od 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automaticky
set -g renumber-windows on

# True color pro Ghostty
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Pluginy
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'vaaleyard/tmux-dotbar'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# tmux-dotbar - config
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-position bottom

# Automatic dark/light theme based on macOS appearance
run-shell '~/.tmux/dotbar-theme-switcher.sh'
set-hook -g 'after-resize-pane run-shell "~/.tmux/dotbar-theme-switcher.sh"'
set-hook -g 'after-new-window run-shell "~/.tmux/dotbar-theme-switcher.sh"'
set-hook -g 'after-kill-pane run-shell "~/.tmux/dotbar-theme-switcher.sh"'
bind T run-shell '~/.tmux/dotbar-theme-switcher.sh' \; display 'Dotbar theme refreshed'

# Resize - musí být až po pluginech
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
